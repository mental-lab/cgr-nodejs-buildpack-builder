name: Publish Builder

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Get the code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install pack CLI
      run: |
        curl -sSL "https://github.com/buildpacks/pack/releases/download/v0.32.1/pack-v0.32.1-linux.tgz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv pack

    - name: Build and push stack images
      run: |
        docker build -t ghcr.io/mental-lab/chainguard-node-build:latest -f stack/build.Dockerfile stack/
        docker build -t ghcr.io/mental-lab/chainguard-node-run:latest -f stack/run.Dockerfile stack/
        docker push ghcr.io/mental-lab/chainguard-node-build:latest
        docker push ghcr.io/mental-lab/chainguard-node-run:latest

    - name: Pull stack images for builder creation
      run: |
        docker pull ghcr.io/mental-lab/chainguard-node-build:latest
        docker pull ghcr.io/mental-lab/chainguard-node-run:latest

    - name: Create and publish builder
      run: |
        pack builder create ghcr.io/mental-lab/chainguard-node-builder:latest --config builder.toml
        docker push ghcr.io/mental-lab/chainguard-node-builder:latest

    - name: Test published builder
      run: |
        mkdir test-publish
        cd test-publish
        echo '{"name": "test", "scripts": {"start": "node server.js"}}' > package.json
        echo 'console.log("Published builder works!"); require("http").createServer((req,res) => res.end("Success!")).listen(3000);' > server.js
        pack build test-published --builder ghcr.io/mental-lab/chainguard-node-builder:latest --path .

name: Publish Builder

on:
  push:
    branches: [ main ]

jobs:
  build-stacks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Get the code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push stack images (multi-arch)
      run: |
        docker buildx build --platform linux/amd64,linux/arm64 \
          -t ghcr.io/mental-lab/chainguard-node-build:latest \
          -f stack/build.Dockerfile stack/ --push
        docker buildx build --platform linux/amd64,linux/arm64 \
          -t ghcr.io/mental-lab/chainguard-node-run:latest \
          -f stack/run.Dockerfile stack/ --push

  build-builder:
    needs: build-stacks
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            tag: amd64
          - runner: ubuntu-24.04-arm
            tag: arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Get the code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install pack CLI
      run: |
        ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        curl -sSL "https://github.com/buildpacks/pack/releases/download/v0.32.1/pack-v0.32.1-linux-${ARCH}.tgz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv pack

    - name: Create and push builder
      run: |
        pack builder create ghcr.io/mental-lab/chainguard-node-builder:${{ matrix.tag }} --config builder.toml
        docker push ghcr.io/mental-lab/chainguard-node-builder:${{ matrix.tag }}

  publish:
    needs: build-builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install pack CLI
      run: |
        curl -sSL "https://github.com/buildpacks/pack/releases/download/v0.32.1/pack-v0.32.1-linux.tgz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv pack

    - name: Combine into multi-arch manifest
      run: |
        docker buildx imagetools create \
          -t ghcr.io/mental-lab/chainguard-node-builder:latest \
          ghcr.io/mental-lab/chainguard-node-builder:amd64 \
          ghcr.io/mental-lab/chainguard-node-builder:arm64

    - name: Test published builder
      run: |
        mkdir test-publish
        cd test-publish
        echo '{"name": "test", "scripts": {"start": "node server.js"}}' > package.json
        echo 'console.log("Published builder works!"); require("http").createServer((req,res) => res.end("Success!")).listen(3000);' > server.js
        pack build test-published --builder ghcr.io/mental-lab/chainguard-node-builder:latest --path . --pull-policy always
